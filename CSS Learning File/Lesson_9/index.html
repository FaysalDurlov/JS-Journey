<!DOCTYPE html>
<html lang="en">
    <head>
        <link rel="stylesheet" href="index.css">
    </head>
    <body>
        <div class="youtubeMusic">
            <p class="youtubeMusicTitle">Install YouTube Music</p>
            <p class="youtubeMusicsSubtitle">Add YouTube Music to your desktop for quick and easy access</p>
        </div>
        <div class="tweeterMassage">
            <div class="tweeterImageContainer"><img class="tweeterImage" src="../Lesson_7/images/images.jpg"></div>
            <input class="tweetMassageInputField" type="text" placeholder="What's happening&#63;">
            <button class="tweetButton">Tweet</button>
        </div>
        <div class="FaceebookProfilesContainer">
            <div class="FaceBookProfile">
                <img class="profileImage" src="../Lesson_7/images/images.jpg">
                <div class="FaceBookProfileInformationContainer">
                    <p class="ProfileName">Oliver</p>
                    <p class="FriendCount">2 mutual friends</p>
                    <button class="AddFriendbutton">Add Friend</button>
                </div>
            </div>
            <div class="FaceBookProfile">
                <img class="profileImage" src="../Lesson_7/images/images (2).jpg">
                <div class="FaceBookProfileInformationContainer">
                    <p class="ProfileName">Mimi</p>
                    <p class="FriendCount">3 mutual friends</p>
                    <button class="AddFriendbutton">Add Friend</button>
                </div>
            </div>
            <div class="FaceBookProfile">
                <img class="profileImage" src="../Lesson_7/images/images (1).jpg">
                <div class="FaceBookProfileInformationContainer">
                    <p class="ProfileName">Rex</p>
                    <p class="FriendCount">4 mutual friends</p>
                    <button class="AddFriendbutton">Add Friend</button>
                </div>
            </div>
        </div>

        <div class="GoogleSearchEngineContainer">
            <img class="GoogleLogoImage" src="../Lesson_8/images/googleImage.jpg">
            <input class="SearchInputField" type="text" placeholder="Search Google or type a URL">
            <div class="GoogleSearchEngineButtonContainer">
                <button class="GoogleSearchEngineButtons">Google Search</button>
                <button class="GoogleSearchEngineButtons">I'am Felling Lucky</button>
            </div>

        </div>
    </body>
</html>
