<!DOCTYPE html>
<html>
    <head>
        <meta Charset="UTF-8">
        <link rel="stylesheet" href="index.css">
        <title>Lesson 8 Exercise</title>

    <body>
        <input class="InfoBasicTextField" type="text" placeholder="Name">
        <input class="InfoBasicTextField" type="text" placeholder="Email">
        <div class="CustomerSupprotContainer">
            <p class="customerSupportText">
                Thanks for chatting with our customer support. Would you like to take our quick survey&quest;
            </p>
            <button class="CustomerSupportButton">Yes</button>
            <button class="CustomerSupportButton">No</button>
        </div>

            <img class="googleImage" src="images\googleImage.jpg">
            <input class="googleSearchTextField" type="text" placeholder="Search Google or type a URL">
        </div>
        <div class="SignUpFormContainer">
            <input class="SignUpfirstName" type="text" placeholder="First name">
            <input class="SignUpLastName" type="text" placeholder="Last name">

        </div>
        <div class="uberRequestformContainer">
            <p class="requestHeading">Request a ride now</p>
            <input class="pickupTextfield" type="text" placeholder="Enter pickup Location">
            <input class="destinationTextfield" type="text" placeholder="Enter destination">
            <button class="UberrequestButton">Request now</button>
            <button class="UberScheduleButton">Schedule for later</button>
        </div>
